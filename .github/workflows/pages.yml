name: Deploy a GitHub Pages

on:
  push:
    branches: [claude/aura-elo-ranking-argentina-ggfjy4, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar fotos de Wikipedia/Commons
        run: python3 descargar_fotos.py || echo "Descarga parcial; la página tiene fallback en vivo"

      - name: Armar el sitio
        run: |
          mkdir _site
          cp index.html _site/
          cp -r fotos _site/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
