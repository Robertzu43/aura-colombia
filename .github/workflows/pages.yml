name: Deploy a GitHub Pages

on:
  push:
    branches: [claude/aura-elo-ranking-argentina-ggfjy4, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar fotos de Wikipedia/Commons
        run: python3 descargar_fotos.py || echo "Descarga parcial; la página tiene fallback en vivo"

      - name: Armar el sitio
        run: |
          mkdir _site
          cp index.html _site/
          cp -r fotos _site/

      - name: Publicar en la rama gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
